name: phoenix

x-shop: &shop
  build: ./services/shoplite
  command: ["node", "/app/shop-runner.cjs"]
  depends_on:
    version-switch:
      condition: service_healthy
  volumes:
    - checkout-revisions:/app/revisions:ro
    - ./services/version_switch/shop-runner.cjs:/app/shop-runner.cjs:ro
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    interval: 3s
    timeout: 2s
    retries: 10

services:
  shop-a:
    <<: *shop
    environment:
      PHOENIX_SLOT: a

  shop-b:
    <<: *shop
    environment:
      PHOENIX_SLOT: b

  version-switch:
    build:
      context: ./services
      target: switch
    command: ["python", "-m", "uvicorn", "version_switch.api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      SHOP_A_URL: http://shop-a:3001
      SHOP_B_URL: http://shop-b:3001
      PHOENIX_SWITCH_STATE_PATH: /data/switch-state.json
      PHOENIX_REVISIONS_PATH: /revisions
      PHOENIX_SOURCE_GIT: /source.git
      PHOENIX_START_SLOT: "${PHOENIX_START_SLOT:-a}"
    ports:
      - "127.0.0.1:${PHOENIX_SWITCH_PORT:-8080}:8080"
    volumes:
      - switch-data:/data
      - checkout-revisions:/revisions
      - ./.git:/source.git:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/state', timeout=1).close()"]
      interval: 3s
      timeout: 2s
      retries: 10

  brain:
    build: ./services
    command: ["python", "-m", "uvicorn", "brain.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PHOENIX_CHECKOUT_URL: http://version-switch:8080/checkout
      PHOENIX_SWITCH_URL: http://version-switch:8080
      PHOENIX_BAD_REV: "${PHOENIX_BAD_REV:-}"
      PHOENIX_DB_PATH: /data/phoenix.sqlite3
      PHOENIX_PROBE_INTERVAL_SECONDS: "${PHOENIX_PROBE_INTERVAL_SECONDS:-2}"
      PHOENIX_SHOP_REPO: /revisions/repo
      PHOENIX_LAB_DIR: /data/lab
      PHOENIX_LOG_DIR: /data/logs
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MODEL_FAST: "${MODEL_FAST:-}"
      MODEL_STRONG: "${MODEL_STRONG:-}"
      PHOENIX_LLM_RPM: "${PHOENIX_LLM_RPM:-12}"
      PHOENIX_LLM_CONCURRENCY: "${PHOENIX_LLM_CONCURRENCY:-2}"
      PHOENIX_DASHBOARD_ORIGINS: "${PHOENIX_DASHBOARD_ORIGINS:-http://localhost:${PHOENIX_DASHBOARD_PORT:-3000},http://127.0.0.1:${PHOENIX_DASHBOARD_PORT:-3000}}"
      MODEL_FALLBACKS: "${MODEL_FALLBACKS:-gemini-3.8-flash,gemini-3.6-flash}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
    ports:
      - "127.0.0.1:${PHOENIX_BRAIN_PORT:-8000}:8000"
    volumes:
      - incident-data:/data
      - checkout-revisions:/revisions
    depends_on:
      version-switch:
        condition: service_healthy
      shop-a:
        condition: service_healthy
      shop-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).close()"]
      interval: 3s
      timeout: 2s
      retries: 10

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        NEXT_PUBLIC_BRAIN_URL: "${NEXT_PUBLIC_BRAIN_URL:-http://127.0.0.1:${PHOENIX_BRAIN_PORT:-8000}}"
    ports:
      - "127.0.0.1:${PHOENIX_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  incident-data:
  switch-data:
  checkout-revisions:
